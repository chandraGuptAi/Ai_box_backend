# AI Box: a JSON, CORS-readable answer when the backend container is down or restarting.
#
# Without this, nginx answers a refused/reset upstream with an HTML 502 that carries no CORS headers.
# The browser then hides the response, Angular sees status 0 and shows "The AI backend is unreachable".
# With it, Angular receives the standard error body ({"error": {...}}) with status 503 and retryable=true.
#
# Apply in /etc/nginx/sites-available/voiceai-8200 (server block that proxies to 127.0.0.1:8201):
#   1. Add the two lines marked [location] inside "location / { ... }".
#   2. Add the named location below inside the same "server { ... }" block.
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Only errors nginx itself generates (connection refused/reset, upstream timeout) are replaced:
# proxy_intercept_errors stays off, so the backend's own 502/503/504 JSON errors pass through unchanged.

# [location] inside "location / { ... }":
#     error_page 502 504 = @ai_box_unavailable;
#     proxy_next_upstream off;

location @ai_box_unavailable {
    default_type application/json;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Expose-Headers "Content-Disposition, X-Report-Access-Token, X-Request-Id" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    if ($request_method = OPTIONS) {
        return 204;
    }
    return 503 '{"error":{"code":"service_unavailable","category":"server","message":"AI Box is busy or restarting right now. Please try again in a minute.","details":null,"retryable":true,"request_id":null}}';
}
